<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>木质数字拼图</title>

    <!-- 引入外部样式表 -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="game-wrap">

        <!-- 标题区 -->
        <h1 class="game-title">木 质 数 字 拼 图</h1>
        <p class="subtitle">4 × 4 经典数字滑块</p>

        <!-- 信息栏：步数 + 时间 -->
        <div class="info-bar">
            <div class="info-item">
                <span class="info-label">步 数</span>
                <span class="info-value" id="steps">0</span>
            </div>
            <div class="info-item">
                <span class="info-label">时 间</span>
                <span class="info-value" id="time">00:00</span>
            </div>
        </div>

        <!-- 棋盘：外框 + 木槽 -->
        <div class="board-frame">
            <div class="board" id="board">
                <!-- 数字方块由 game.js 动态生成 -->
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="btn-row">
            <button class="btn btn-restart">重 新 开 始</button>
        </div>

        <!-- 操作提示 -->
        <p class="tip">
            点击空格旁边的方块即可移动<br>
            电脑端也可用方向键 / WASD 操作<br>
            将数字按 1～15 顺序排列即获胜
        </p>

    </div>

    <!-- 胜利弹窗 -->
    <div class="win-mask" id="winMask">
        <div class="win-card">
            <h2 class="win-title">🎉 恭 喜 通 关</h2>
            <p class="win-sub">你成功还原了拼图！</p>
            <div class="win-stats">
                用时：<b id="winTime">00:00</b><br>
                步数：<b id="winSteps">0</b>
            </div>
            <button class="btn btn-restart">再 玩 一 次</button>
        </div>
    </div>

    <!-- 引入游戏逻辑脚本（放在 body 末尾，确保 DOM 先加载） -->
    <script src="js/game.js"></script>

</body>
</html>
