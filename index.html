
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个 H5 游戏</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(135deg, #101a35, #263f70);
        }

        .game-box {
            width: 90%;
            max-width: 500px;
            padding: 40px 25px;
            text-align: center;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.8;
        }

        button {
            margin-top: 25px;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            background: #38bdf8;
            color: #102039;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #7dd3fc;
            transform: scale(1.05);
        }

        #message {
            margin-top: 25px;
            min-height: 30px;
            color: #fde68a;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="game-box">
        <h1>🎮 我的第一个 H5 游戏</h1>
        <p>游戏版本：V1.1</p>

        <p>
            欢迎来到我的游戏世界！<br>
            这是我使用 HTML 制作的第一个网页。
        </p>

        <p>点击下面的按钮，开始你的游戏之旅！</p>

        <button onclick="startGame()">开始游戏</button>

        <div id="message">准备好了吗？</div>
    </div>

    <script>
        function startGame() {
            document.getElementById("message").innerText =
                "🎉 游戏启动成功！欢迎来到游戏世界！";
        }
    </script>

</body>
</html>
